[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yongin-public-data-collector"
version = "0.1.0"
description = "Scoped file and API raw collector for Yongin leisure public data"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "python-dotenv>=1,<2", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
yongin-collect = "yongin_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
