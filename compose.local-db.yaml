name: yongin-local-db

services:
  postgres:
    image: postgres:17-alpine
    container_name: yongin-local-postgres
    restart: unless-stopped
    env_file:
      - ./.runtime/local-postgres.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - yongin_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yongin"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - n8n_default

volumes:
  yongin_pgdata:

networks:
  n8n_default:
    external: true
