[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yongin-public-data-collector"
version = "0.1.0"
description = "Scoped file and API raw collector for Yongin leisure public data"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.120,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1,<2",
  "tzdata>=2025.2",
  "uvicorn>=0.38,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
portal = ["playwright>=1.58,<2"]

[project.scripts]
yongin-collect = "yongin_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yongin_collector = ["static/*.html"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
